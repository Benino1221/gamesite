<!DOCTYPE html>
<html>
<head>
    <title>Flappy Bird</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(45deg, #2c3e50, #3498db);
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            touch-action: none;
            transition: background 0.5s ease;
        }

        body.dark-mode {
            background: linear-gradient(45deg, #1a1a1a, #2c3e50);
        }

        #game-container {
            position: relative;
            width: 100vmin;
            height: 100vmin;
            max-width: 100%;
            max-height: 90vh;
            background: #4ec0ca;
            overflow: hidden;
            display: none;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0,0,0,0.3);
            aspect-ratio: 2/3;
        }

        @media (min-width: 768px) {
            body {
                background: linear-gradient(45deg, #1a1a1a, #2c3e50);
            }
            
            #game-container {
                width: 400px;
                height: 600px;
                max-height: 90vh;
                margin: auto;
            }
            
            body.dark-mode {
                background: linear-gradient(45deg, #0a0a0a, #1c1c1c);
            }
        }

        @media (max-width: 767px) and (orientation: portrait) {
            #game-container {
                width: 100vw;
                height: 100vh;
                max-width: none;
                max-height: none;
                border-radius: 0;
            }
        }

        .menu {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255, 255, 255, 0.95);
            padding: 1.5rem;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 0 20px rgba(0,0,0,0.2);
            opacity: 0;
            transition: opacity 0.3s ease;
            z-index: 200;
            width: 90%;
            max-width: 320px;
            max-height: 80vh;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        .menu.show {
            opacity: 1;
        }

        .menu-close {
            position: absolute;
            top: 10px;
            right: 10px;
            cursor: pointer;
            color: #666;
            background: none;
            border: none;
            font-size: 1.2rem;
            padding: 5px;
        }

        #main-menu {
            display: block;
            opacity: 1;
        }

        #death-menu, #settings-menu {
            display: none;
        }

        .settings-icon {
            position: absolute;
            top: 15px;
            right: 15px;
            cursor: pointer;
            color: #2c3e50;
            background: rgba(255,255,255,0.9);
            border-radius: 50%;
            padding: 8px;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            transition: all 0.2s ease;
        }

        .settings-icon:hover {
            transform: scale(1.1);
            background: white;
        }

        #bird {
            position: absolute;
            background: #ffd700;
            border-radius: 50%;
            left: 80px;
            top: 50%;
            transition: transform 0.2s ease;
            box-shadow: 0 0 10px rgba(0,0,0,0.2);
        }

        .pipe {
            position: absolute;
            background: #2ecc71;
            transition: right 0.1s linear;
            box-shadow: 0 0 10px rgba(0,0,0,0.2);
        }

        .score-display {
            position: absolute;
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            color: white;
            z-index: 100;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        #current-score {
            font-size: 48px;
            font-weight: bold;
        }

        .menu h1 {
            color: #2c3e50;
            margin: 0 0 1rem 0;
            font-size: 1.5rem;
        }

        .menu p {
            color: #666;
            margin: 1rem 0;
            font-size: 1rem;
        }

        .button-group {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin-top: 1.5rem;
        }

        button {
            padding: 12px 24px;
            font-size: 1rem;
            background: #e74c3c;
            border: none;
            color: white;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        button:hover {
            background: #c0392b;
            transform: translateY(-2px);
        }

        button.secondary {
            background: #3498db;
        }

        button.secondary:hover {
            background: #2980b9;
        }

        .settings-item {
            margin: 10px 0;
            text-align: left;
        }

        .slider {
            width: 100%;
            margin: 10px 0;
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .settings-section {
            margin: 10px 0;
            padding: 8px;
            background: rgba(0,0,0,0.05);
            border-radius: 8px;
        }

        .settings-section h3 {
            margin: 0 0 10px 0;
            color: #333;
            font-size: 1rem;
        }

        .custom-color-picker {
            width: 100%;
            height: 40px;
            border: none;
            cursor: pointer;
            background: transparent;
        }

        @media (max-width: 480px) {
            .menu {
                width: 95%;
                padding: 1rem;
            }
            
            #settings-menu {
                padding: 2rem 1rem 1rem;
            }
            
            .menu h1 {
                font-size: 1.3rem;
            }
            
            .button-group {
                margin-top: 1rem;
                gap: 0.8rem;
            }
            
            button {
                padding: 10px 20px;
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>
    <div id="version-number">v3.0</div>

    <div id="main-menu" class="menu show">
        <div class="settings-icon" onclick="showMenu('settings-menu')">
            <i class="fas fa-cog"></i>
        </div>
        <h1>Flappy Bird</h1>
        <p id="best-score">Best Score: 0</p>
        <div class="button-group">
            <button onclick="startGame()" class="secondary">Start Game</button>
        </div>
    </div>

    <div id="death-menu" class="menu">
        <h1>Game Over!</h1>
        <p id="final-score">Score: 0</p>
        <p id="death-best-score">Best: 0</p>
        <div class="button-group">
            <button onclick="startGame()">Play Again</button>
            <button onclick="showMainMenu()" class="secondary">Main Menu</button>
        </div>
    </div>

    <div id="settings-menu" class="menu">
        <button class="menu-close" onclick="showMainMenu()">
            <i class="fas fa-times"></i>
        </button>
        <h1>Settings</h1>
        
        <div class="settings-section">
            <h3>Appearance</h3>
            <div class="settings-item">
                <label>Bird Color:</label>
                <input type="color" id="color-picker" class="custom-color-picker" value="#ffd700">
            </div>
            <div class="settings-item">
                <label>Bird Size: <span id="bird-size-value">30</span>px</label>
                <input type="range" id="bird-size" class="slider" min="20" max="50" value="30">
            </div>
        </div>

        <div class="settings-section">
            <h3>Gameplay</h3>
            <div class="settings-item">
                <label class="checkbox-label">
                    <input type="checkbox" id="glide-toggle" checked>
                    Enable Glide
                </label>
            </div>
            <div class="settings-item">
                <label>Pipe Width: <span id="pipe-width-value">70</span>px</label>
                <input type="range" id="pipe-width" class="slider" min="50" max="100" value="70">
            </div>
        </div>

        <div class="settings-section">
            <h3>Environment</h3>
            <div class="settings-item">
                <label class="checkbox-label">
                    <input type="checkbox" id="dark-mode-toggle">
                    Dark Mode
                </label>
            </div>
            <div class="settings-item">
                <label class="checkbox-label">
                    <input type="checkbox" id="particle-toggle" checked>
                    Enable Particles
                </label>
            </div>
        </div>

        <div class="button-group">
            <button onclick="resetBestScore()" class="secondary">Reset Progress</button>
        </div>
    </div>

    <div id="game-container">
        <div class="score-display">
            <div id="current-score">0</div>
        </div>
        <div id="bird">
            <div class="bird-wing"></div>
        </div>
    </div>

    <script>
        const bird = document.getElementById('bird');
        const gameContainer = document.getElementById('game-container');
        const menus = {
            main: document.getElementById('main-menu'),
            death: document.getElementById('death-menu'),
            settings: document.getElementById('settings-menu')
        };
        const currentScoreElement = document.getElementById('current-score');
        const bestScoreElement = document.getElementById('best-score');
        
        const physicsSettings = {
            glide: { gravity: 0.15, jumpForce: -8.5, damping: 0.95 },
            noGlide: { gravity: 0.25, jumpForce: -7.5, damping: 1.0 }
        };

        let birdY = 300;
        let velocity = 0;
        let isGameOver = false;
        let score = 0;
        let pipes = [];
        let bestScore = localStorage.getItem('flappyBestScore') || 0;
        let isPlaying = false;
        let enableGlide = true;
        let particleEffects = true;
        let birdSize = 30;
        let pipeWidth = 70;
        let darkMode = false;

        function initializeGame() {
            bestScoreElement.textContent = `Best Score: ${bestScore}`;
            
            const savedColor = localStorage.getItem('birdColor') || '#ffd700';
            birdSize = parseInt(localStorage.getItem('birdSize')) || 30;
            pipeWidth = parseInt(localStorage.getItem('pipeWidth')) || 70;
            enableGlide = localStorage.getItem('enableGlide') !== 'false';
            particleEffects = localStorage.getItem('particleEffects') !== 'false';
            darkMode = localStorage.getItem('darkMode') === 'true';

            setBirdColor(savedColor);
            updateBirdSize();
            document.getElementById('color-picker').value = savedColor;
            document.getElementById('bird-size').value = birdSize;
            document.getElementById('pipe-width').value = pipeWidth;
            document.getElementById('glide-toggle').checked = enableGlide;
            document.getElementById('particle-toggle').checked = particleEffects;
            document.getElementById('dark-mode-toggle').checked = darkMode;
            document.getElementById('bird-size-value').textContent = birdSize;
            document.getElementById('pipe-width-value').textContent = pipeWidth;
            toggleDarkMode(darkMode);
        }

        function setBirdColor(color) {
            bird.style.background = color;
            localStorage.setItem('birdColor', color);
        }

        function updateBirdSize() {
            bird.style.width = `${birdSize}px`;
            bird.style.height = `${birdSize}px`;
            localStorage.setItem('birdSize', birdSize);
        }

        function toggleDarkMode(enable) {
            darkMode = enable;
            document.body.classList.toggle('dark-mode', enable);
            localStorage.setItem('darkMode', enable);
            
            if(window.innerWidth >= 768) {
                document.body.style.background = enable 
                    ? 'linear-gradient(45deg, #0a0a0a, #1c1c1c)' 
                    : 'linear-gradient(45deg, #2c3e50, #3498db)';
            }
        }

        function resetBestScore() {
            bestScore = 0;
            localStorage.setItem('flappyBestScore', 0);
            bestScoreElement.textContent = 'Best Score: 0';
        }

        function checkCollision() {
            const birdRadius = birdSize / 2;
            const birdX = 80 + birdRadius;
            const birdCenterY = birdY + birdRadius;

            return pipes.some(pipe => {
                const pipeX = pipe.x;
                const topPipeHeight = parseFloat(pipe.top.style.height);
                const bottomPipeY = gameContainer.offsetHeight - parseFloat(pipe.bottom.style.height);

                return birdX + birdRadius > pipeX && 
                    birdX - birdRadius < pipeX + pipeWidth &&
                    (birdCenterY - birdRadius < topPipeHeight ||
                     birdCenterY + birdRadius > bottomPipeY);
            });
        }

        function jump() {
            if (!isPlaying || isGameOver) return;
            
            const settings = enableGlide ? physicsSettings.glide : physicsSettings.noGlide;
            velocity = settings.jumpForce;
            velocity *= settings.damping;
            
            if(particleEffects) {
                createParticles(bird.offsetLeft + birdSize/2, bird.offsetTop + birdSize/2);
            }
            
            bird.style.transform = 'rotate(-25deg)';
            setTimeout(() => bird.style.transform = 'rotate(25deg)', 100);
        }

        function createParticles(x, y) {
            for (let i = 0; i < 8; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = x + 'px';
                particle.style.top = y + 'px';
                document.body.appendChild(particle);
                
                const angle = (Math.PI * 2 * i) / 8;
                const velocity = 5;
                particle.style.transform = `translate(${Math.cos(angle) * velocity}px, ${Math.sin(angle) * velocity}px)`;
                
                setTimeout(() => particle.remove(), 800);
            }
        }

        function createPipe() {
            const gapHeight = 160;
            const gapPosition = Math.random() * (gameContainer.offsetHeight - gapHeight - 150) + 75;
            
            const topPipe = document.createElement('div');
            topPipe.className = 'pipe';
            topPipe.style.width = `${pipeWidth}px`;
            topPipe.style.height = gapPosition + 'px';
            topPipe.style.top = '0';
            topPipe.style.right = `-${pipeWidth}px`;
            gameContainer.appendChild(topPipe);

            const bottomPipe = document.createElement('div');
            bottomPipe.className = 'pipe';
            bottomPipe.style.width = `${pipeWidth}px`;
            bottomPipe.style.height = (gameContainer.offsetHeight - gapPosition - gapHeight) + 'px';
            bottomPipe.style.bottom = '0';
            bottomPipe.style.right = `-${pipeWidth}px`;
            gameContainer.appendChild(bottomPipe);

            pipes.push({
                top: topPipe,
                bottom: bottomPipe,
                passed: false,
                x: gameContainer.offsetWidth
            });
        }

        function updateGame() {
            if (isGameOver) return;
            
            const settings = enableGlide ? physicsSettings.glide : physicsSettings.noGlide;
            velocity += settings.gravity;
            velocity *= settings.damping;
            birdY += velocity;
            bird.style.top = birdY + 'px';

            if (birdY < -birdSize || birdY + birdSize > gameContainer.offsetHeight + 15) {
                gameOver();
            }

            pipes.forEach((pipe, index) => {
                pipe.x -= 2.5;
                pipe.top.style.right = (gameContainer.offsetWidth - pipe.x - pipeWidth) + 'px';
                pipe.bottom.style.right = (gameContainer.offsetWidth - pipe.x - pipeWidth) + 'px';

                if (!pipe.passed && pipe.x < 80) {
                    pipe.passed = true;
                    score++;
                    currentScoreElement.textContent = score;
                    
                    if (score > bestScore) {
                        bestScore = score;
                        localStorage.setItem('flappyBestScore', bestScore);
                        bestScoreElement.textContent = `Best Score: ${bestScore}`;
                    }
                }

                if (pipe.x < -pipeWidth) {
                    pipe.top.remove();
                    pipe.bottom.remove();
                    pipes.splice(index, 1);
                }
            });

            if (checkCollision()) {
                gameOver();
            }

            requestAnimationFrame(updateGame);
        }

        function gameOver() {
            isGameOver = true;
            isPlaying = false;
            document.querySelector('#final-score').textContent = `Score: ${score}`;
            document.querySelector('#death-best-score').textContent = `Best: ${bestScore}`;
            showMenu('death-menu');
            
            pipes.forEach(pipe => {
                pipe.top.remove();
                pipe.bottom.remove();
            });
            pipes = [];
            birdY = 300;
            velocity = 0;
        }

        function showMenu(menuId) {
            Object.values(menus).forEach(menu => {
                menu.classList.remove('show');
                menu.style.display = 'none';
            });
            const menu = document.getElementById(menuId);
            if(menu) {
                menu.style.display = 'block';
                setTimeout(() => menu.classList.add('show'), 10);
            } else {
                gameContainer.style.display = 'block';
            }
        }

        function showMainMenu() {
            showMenu('main-menu');
            score = 0;
            currentScoreElement.textContent = '0';
            bird.style.top = birdY + 'px';
            bird.style.transform = 'rotate(0deg)';
        }

        function startGame() {
            showMenu();
            gameContainer.style.display = 'block';
            isGameOver = false;
            isPlaying = true;
            score = 0;
            currentScoreElement.textContent = '0';
            updateGame();
        }

        window.addEventListener('resize', () => {
            if(window.innerWidth >= 768) {
                toggleDarkMode(darkMode);
            } else {
                document.body.style.background = darkMode 
                    ? 'linear-gradient(45deg, #1a1a1a, #2c3e50)' 
                    : 'linear-gradient(45deg, #2c3e50, #3498db)';
            }
        });

        document.addEventListener('keydown', e => {
            if (e.code === 'Space') jump();
        });

        document.addEventListener('click', jump);
        document.addEventListener('touchstart', e => {
            e.preventDefault();
            jump();
        });

        document.getElementById('color-picker').addEventListener('input', (e) => {
            setBirdColor(e.target.value);
        });

        document.getElementById('bird-size').addEventListener('input', (e) => {
            birdSize = e.target.value;
            document.getElementById('bird-size-value').textContent = birdSize;
            updateBirdSize();
        });

        document.getElementById('pipe-width').addEventListener('input', (e) => {
            pipeWidth = e.target.value;
            document.getElementById('pipe-width-value').textContent = pipeWidth;
            localStorage.setItem('pipeWidth', pipeWidth);
        });

        document.getElementById('glide-toggle').addEventListener('change', function() {
            enableGlide = this.checked;
            localStorage.setItem('enableGlide', enableGlide);
        });

        document.getElementById('particle-toggle').addEventListener('change', function() {
            particleEffects = this.checked;
            localStorage.setItem('particleEffects', particleEffects);
        });

        document.getElementById('dark-mode-toggle').addEventListener('change', function() {
            toggleDarkMode(this.checked);
        });

        initializeGame();
        setInterval(() => {
            if (isPlaying) createPipe();
        }, 1500);
    </script>
</body>
</html>
