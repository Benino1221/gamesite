<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Hub</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background: #f0f0f0;
        }
        .game-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .game-card {
            background: white;
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            transition: transform 0.2s;
        }
        .game-card:hover {
            transform: translateY(-5px);
        }
        .game-button {
            background: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        header {
            text-align: center;
            margin-bottom: 40px;
            padding: 20px;
            background: #333;
            color: white;
        }
    </style>
</head>
<body>
    <header>
        <h1>Game Hub</h1>
        <p>Automatically loaded games from /games folder</p>
    </header>

    <div class="game-grid" id="gameContainer"></div>

    <script>
        async function loadGames() {
            try {
                const response = await fetch('/games/?list=1');
                const folders = await response.json();
                
                const gameContainer = document.getElementById('gameContainer');
                
                for (const folder of folders) {
                    try {
                        const metaResponse = await fetch(`/games/${folder}/meta.json`);
                        const meta = await metaResponse.json();
                        
                        const gameCard = document.createElement('div');
                        gameCard.className = 'game-card';
                        gameCard.innerHTML = `
                            <h3>${meta.name}</h3>
                            <p>${meta.description || ''}</p>
                            <button class="game-button" 
                                    onclick="window.location.href='/games/${folder}/'">
                                Play Now
                            </button>
                        `;
                        
                        gameContainer.appendChild(gameCard);
                    } catch (error) {
                        console.log(`Skipping ${folder} - missing meta.json`);
                    }
                }
            } catch (error) {
                console.error('Error loading games:', error);
                gameContainer.innerHTML = '<p>Error loading games. Make sure you have a /games folder with game subfolders.</p>';
            }
        }

        // Initial load
        loadGames();
    </script>
</body>
</html>
